<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevRel Studios — Building Digital Products That Drive Real Growth</title>
    <meta name="description" content="DevRel Studios is a premium product-focused developer agency. We design, build, and scale high-performance digital solutions for startups and businesses." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8KXLEPBN7J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-8KXLEPBN7J');
    </script>
  </head>
  <body>
    <!-- Premium Preloader -->
    <div id="preloader" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0A0A0A;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1), visibility 1s;
        pointer-events: none;
    ">
      <style>
        @keyframes pulse {
          0% { opacity: 0.5; transform: scale(0.98); }
          50% { opacity: 1; transform: scale(1); }
          100% { opacity: 0.5; transform: scale(0.98); }
        }
        @keyframes shimmer {
          0% { background-position: -200% center; }
          100% { background-position: 200% center; }
        }
        .loader-text {
          font-family: 'Inter', sans-serif;
          font-style: italic;
          font-weight: 900;
          font-size: clamp(4rem, 12vw, 7rem);
          margin: 0;
          letter-spacing: -0.05em;
          padding-right: 0.1em;
          background: linear-gradient(90deg, #7C3AED, #006AFF, #7C3AED);
          background-size: 200% auto;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shimmer 3s infinite linear;
          line-height: 1.2;
          display: block;
        }
      </style>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
          <h1 class="loader-text">DRS</h1>
          <div style="
              width: 180px;
              max-width: 80vw;
              height: 2px;
              background: rgba(255, 255, 255, 0.05);
              margin-top: 15px;
              border-radius: 10px;
              overflow: hidden;
              position: relative;
          ">
              <div id="preloader-bar" style="
                  position: absolute;
                  top: 0;
                  left: 0;
                  width: 0%;
                  height: 100%;
                  background: linear-gradient(90deg, #7C3AED, #006AFF);
                  transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1);
              "></div>
          </div>
          <p style="
              font-family: 'Inter', sans-serif;
              color: rgba(255,255,255,0.3);
              font-size: 10px;
              text-transform: uppercase;
              letter-spacing: 5px;
              margin-top: 20px;
              font-weight: 500;
              margin-right: -5px;
              text-align: center;
          ">DevRel Studios</p>
      </div>
    </div>

    <script>
      (function() {
        const bar = document.getElementById('preloader-bar');
        const preloader = document.getElementById('preloader');
        
        // Fake progress
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.random() * 15;
          if (progress > 90) progress = 90;
          if (bar) bar.style.width = progress + '%';
        }, 200);

        window.addEventListener('load', () => {
          clearInterval(interval);
          if (bar) bar.style.width = '100%';
          
          setTimeout(() => {
            if (preloader) {
              preloader.style.opacity = '0';
              preloader.style.visibility = 'hidden';
            }
          }, 400);
        });

        // Fallback for slow loads
        setTimeout(() => {
          if (preloader && preloader.style.opacity !== '0') {
            preloader.style.opacity = '0';
            preloader.style.visibility = 'hidden';
          }
        }, 5000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
